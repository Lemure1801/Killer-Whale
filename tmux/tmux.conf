# ==============================================================================
# KillerWhale — Configuração Central do tmux
# Filosofia: Um programa por tela cheia por workspace, sem splits poluentes
# Paleta: Fósforo Verde (#00ff66) / Preto (#050a05) / Monocromático
# ==============================================================================

# --- Prefixo e Teclas de Controle ---
# Suporta Ctrl+a primário e Ctrl+b secundário
set -g prefix C-a
bind C-a send-prefix
set -g prefix2 C-b
bind C-b send-prefix -2

# Desativa atraso da tecla ESC (crítico para Neovim e TUIs)
set -s escape-time 0

# Histórico generoso de terminal (50.000 linhas de scrollback)
set -g history-limit 50000

# Suporte completo a Truecolor (24-bit) e terminal moderno
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,alacritty:Tc,kitty:Tc,xterm-256color:Tc"

# Habilita mouse para rolagem rápida e foco sem quebrar tela cheia
set -g mouse on

# Numeração de janelas iniciando em 0 (alinhada aos workspaces 00, 01, 02...)
set -g base-index 0
setw -g pane-base-index 0
set -g renumber-windows on

# Shell padrão: fish se disponível, senão bash
set -g default-command "${SHELL}"

# --- Filosofia Fullscreen / Sem Splits Permanentes ---
# Ao invés de splits que dividem a tela, novas janelas abrem em fullscreen
bind c new-window -c "#{pane_current_path}"
# Se splits temporários forem realmente necessários, atalhos intuitivos:
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Maximizar/restaurar pane temporário com facilidade (mantém foco)
bind m resize-pane -Z

# --- Navegação Rápida entre Workspaces ---
bind 0 select-window -t :0
bind 1 select-window -t :1
bind 2 select-window -t :2
bind 3 select-window -t :3
bind 4 select-window -t :4
bind 5 select-window -t :5
bind 6 select-window -t :6
bind 7 select-window -t :7
bind 8 select-window -t :8
bind 9 select-window -t :9

# Navegação anterior / próxima rápida
bind -r [ previous-window
bind -r ] next-window
bind Tab last-window

# --- Integração com Utilitários KillerWhale ---
# Launcher principal (Command Palette) via fzf em nova janela ou popup
bind Space run-shell -b 'ROOT="${KW_ROOT:-$HOME/KillerWhale}"; if [ -f "$ROOT/launcher/menu.sh" ]; then bash "$ROOT/launcher/menu.sh"; elif [ -f "./launcher/menu.sh" ]; then bash "./launcher/menu.sh"; fi'

# Atalhos diretos para ferramentas do Workspace 00
bind k new-window -n "cleanup" "bash -c 'ROOT=\"${KW_ROOT:-$HOME/KillerWhale}\"; if [ -f \"$ROOT/workspaces/00-dashboard/cleanup.sh\" ]; then bash \"$ROOT/workspaces/00-dashboard/cleanup.sh\"; else bash \"./workspaces/00-dashboard/cleanup.sh\"; fi'"
bind ? new-window -n "cheatsheet" "bash -c 'ROOT=\"${KW_ROOT:-$HOME/KillerWhale}\"; if [ -f \"$ROOT/workspaces/00-dashboard/cheatsheet.sh\" ]; then bash \"$ROOT/workspaces/00-dashboard/cheatsheet.sh\"; else bash \"./workspaces/00-dashboard/cheatsheet.sh\"; fi'"
bind e new-window -n "neovim" "bash -c 'ROOT=\"${KW_ROOT:-$HOME/KillerWhale}\"; if [ -x \"$ROOT/launcher/edit.sh\" ]; then \"$ROOT/launcher/edit.sh\"; else XDG_CONFIG_HOME=\"$ROOT\" nvim; fi'"

# Recarregar configuração com feedback visual
bind r source-file ~/.tmux.conf \; display-message " [!] Configuração do tmux recarregada!"

# --- Barra de Status (Fósforo Verde / Box-drawing) ---
set -g status on
set -g status-interval 2
set -g status-position bottom
set -g status-justify left

# Cores da barra de status
set -g status-style "bg=#050a05,fg=#00ff66"

# Lado esquerdo: Identificador da Sessão KillerWhale
set -g status-left-length 30
set -g status-left "#[bg=#003311,fg=#00ff66,bold] 🐋 KW #[bg=#050a05,fg=#006622]│ "

# Formato de janelas inativas (Workspaces em espera)
setw -g window-status-format "#[fg=#006622,bg=#050a05] #I:#[fg=#00aa44]#W #[fg=#003311]│"

# Formato da janela ATIVA (Workspace atual com foco total)
setw -g window-status-current-format "#[bg=#00ff66,fg=#050a05,bold] #I:#W #[bg=#050a05,fg=#00ff66]│"

# Lado direito: Informações de contexto e relógio
set -g status-right-length 80
set -g status-right "#[fg=#008833]HOST: #[fg=#00ff66]#H #[fg=#004d1a]│ #[fg=#008833]ALVO: #[fg=#ffb000]#(cat ~/.killerwhale/target 2>/dev/null || echo 'NONE') #[fg=#004d1a]│ #[fg=#00ff66,bold]%H:%M #[fg=#006622]%d/%m "

# Borda dos painéis (quando houver split transitório)
set -g pane-border-style "fg=#003311"
set -g pane-active-border-style "fg=#00ff66,bold"

# Mensagens do sistema no tmux
set -g message-style "bg=#00ff66,fg=#050a05,bold"
set -g message-command-style "bg=#003311,fg=#00ff66"
